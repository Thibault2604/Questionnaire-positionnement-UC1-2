<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questionnaire de positionnement — UC1 & UC2 · DEJEPS Rugby</title>
<style>
  :root{
    --navy:#22356e; --navy-dark:#172548;
    --gold:#f3c01b; --gold-dark:#d9a800;
    --bordeaux:#8c2b3a;
    --bg:#eef1f8; --card:#ffffff;
    --text:#1d2433; --muted:#6b7488; --border:#e2e6ef;
    --green:#2f8f57;
    --shadow:0 6px 22px rgba(23,37,72,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:24px 22px 80px}

  /* En-tête */
  header.app{
    background:linear-gradient(135deg,var(--navy-dark),var(--navy));
    color:#fff; border-radius:18px; padding:22px 26px;
    display:flex; align-items:center; gap:22px; box-shadow:var(--shadow);
  }
  header.app .logo{
    background:#fff; border-radius:12px; padding:10px 14px; flex:0 0 auto;
    display:flex; align-items:center;
  }
  header.app .logo img{display:block; height:54px; width:auto}
  header.app h1{font-size:1.32rem; margin:0 0 4px; letter-spacing:.2px}
  header.app p{margin:0; opacity:.85; font-size:.92rem}

  /* Barre de progression d'étapes */
  .progress{
    margin:20px 0 8px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .progress .bar{flex:1 1 220px; height:10px; background:#dfe4f1; border-radius:99px; overflow:hidden}
  .progress .bar > span{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-dark)); width:0; transition:width .35s ease}
  .progress .lab{font-size:.82rem; color:var(--muted); font-weight:600; white-space:nowrap}

  .card{
    background:var(--card); border-radius:16px; box-shadow:var(--shadow);
    padding:26px 26px 24px; margin-top:18px; border:1px solid var(--border);
  }
  .eyebrow{
    display:inline-block; font-size:.72rem; font-weight:700; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--bordeaux); background:#fbe9ec;
    padding:4px 10px; border-radius:99px; margin-bottom:12px;
  }
  .card h2{margin:0 0 4px; font-size:1.45rem; color:var(--navy-dark)}
  .card .theme-num{color:var(--gold-dark); font-weight:800}
  .lead{color:var(--muted); margin:.2rem 0 1.2rem}

  /* Champs identité */
  .id-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .field label{display:block; font-weight:600; font-size:.9rem; margin-bottom:5px; color:var(--navy-dark)}
  .field input, .field textarea{
    width:100%; border:1.5px solid var(--border); border-radius:10px; padding:10px 12px;
    font-size:.98rem; font-family:inherit; color:var(--text); background:#fbfcff; transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field textarea:focus{outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(34,53,110,.12)}
  .field textarea.idee{min-height:96px; resize:vertical; line-height:1.5}
  .checks{display:flex; flex-wrap:wrap; gap:14px 26px; margin:14px 0 4px}
  .check{display:inline-flex; align-items:center; gap:9px; font-weight:600; color:var(--navy-dark); font-size:.95rem; cursor:pointer}
  .check input{width:19px; height:19px; accent-color:var(--navy); cursor:pointer; margin:0}

  /* Question ouverte */
  .open-block{background:#f7f9ff; border:1.5px solid #dde3f4; border-radius:14px; padding:18px 18px 16px; margin-bottom:6px}
  .open-block .q{font-weight:700; color:var(--navy-dark); font-size:1.06rem; margin-bottom:10px; display:flex; gap:10px}
  .open-block .q .ico{color:var(--gold-dark)}
  .open-block textarea{display:block; width:100%; box-sizing:border-box; min-height:180px; resize:vertical;
        border:1.5px solid var(--border); border-radius:10px; padding:12px 14px; font-size:1rem;
        font-family:inherit; line-height:1.5; color:var(--text); background:#fff; transition:border-color .15s, box-shadow .15s}
  .open-block textarea:focus{outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(34,53,110,.12)}
  .open-actions{display:flex; align-items:center; gap:12px; margin-top:12px}
  .hint{font-size:.84rem; color:var(--muted)}
  .open-block.validated{background:#f1faf3; border-color:#bfe4cb}
  .check-tag{display:none; align-items:center; gap:6px; color:var(--green); font-weight:700; font-size:.9rem}
  .open-block.validated .check-tag{display:inline-flex}
  .open-block.validated .open-actions .btn-valider{display:none}

  /* Section fermée */
  .closed{display:none; margin-top:22px; animation:fade .4s ease}
  .closed.show{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}

  .legend{
    display:flex; gap:8px; flex-wrap:wrap; background:#fffbe9; border:1px solid #f3e2a8;
    border-radius:10px; padding:10px 12px; margin-bottom:16px; font-size:.8rem; color:#6b5a16;
  }
  .legend b{color:var(--navy-dark)}
  .legend span{white-space:nowrap}

  .item{
    border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:12px; background:#fff;
    transition:border-color .15s, background .15s;
  }
  .item.answered{border-color:#cfe0d4; background:#fcfffc}
  .item .txt{font-weight:600; color:var(--text); margin-bottom:10px}
  .opts{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
  .opt{position:relative}
  .opt input{position:absolute; opacity:0; inset:0; cursor:pointer; margin:0}
  .opt label{
    display:flex; flex-direction:column; align-items:center; gap:3px; text-align:center;
    border:1.5px solid var(--border); border-radius:10px; padding:8px 4px; cursor:pointer;
    background:#fafbfe; transition:all .15s; height:100%;
  }
  .opt .n{font-weight:800; font-size:1.15rem; color:var(--muted); line-height:1}
  .opt .l{font-size:.72rem; color:var(--muted); line-height:1.15}
  .opt input:hover + label{border-color:var(--navy)}
  .opt input:checked + label{border-color:var(--navy); background:var(--navy); box-shadow:0 4px 10px rgba(34,53,110,.22)}
  .opt input:checked + label .n,
  .opt input:checked + label .l{color:#fff}

  /* Score thématique */
  .score-box{
    margin-top:18px; background:linear-gradient(135deg,#f7f9ff,#eef2fc);
    border:1.5px solid #dde3f4; border-radius:14px; padding:16px 18px;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  .score-box .val{font-size:1.9rem; font-weight:800; color:var(--navy-dark); line-height:1; min-width:84px}
  .score-box .val small{font-size:.9rem; color:var(--muted); font-weight:600}
  .score-box .meta{flex:1 1 200px}
  .score-bar{height:12px; background:#dfe4f1; border-radius:99px; overflow:hidden; margin-top:8px}
  .score-bar > span{display:block; height:100%; width:0; border-radius:99px; transition:width .4s ease, background .4s}
  .score-box .count{font-size:.82rem; color:var(--muted)}

  /* Tableau outils */
  .tools-legend{font-size:.8rem; color:var(--muted); margin:-6px 0 14px}
  table.tools{width:100%; border-collapse:collapse; font-size:.92rem}
  table.tools th, table.tools td{padding:9px 8px; border-bottom:1px solid var(--border); text-align:center}
  table.tools th{font-size:.72rem; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:700}
  table.tools td:first-child, table.tools th:first-child{text-align:left; font-weight:600; color:var(--text)}
  table.tools input{width:18px; height:18px; accent-color:var(--navy); cursor:pointer}

  /* Navigation */
  .nav{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:22px}
  .btn{
    border:none; border-radius:11px; padding:12px 22px; font-size:.96rem; font-weight:700;
    cursor:pointer; font-family:inherit; transition:transform .12s, box-shadow .15s, background .15s; display:inline-flex; align-items:center; gap:8px;
  }
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--navy); color:#fff; box-shadow:0 4px 12px rgba(34,53,110,.25)}
  .btn-primary:hover{background:var(--navy-dark)}
  .btn-gold{background:var(--gold); color:var(--navy-dark); box-shadow:0 4px 12px rgba(217,168,0,.3)}
  .btn-gold:hover{background:var(--gold-dark)}
  .btn-ghost{background:#fff; color:var(--navy); border:1.5px solid var(--border)}
  .btn-ghost:hover{border-color:var(--navy)}
  .btn-valider{background:var(--gold); color:var(--navy-dark)}
  .btn[disabled]{opacity:.45; cursor:not-allowed; box-shadow:none}
  .btn-danger{background:#fff; color:var(--bordeaux); border:1.5px solid #e7c9cf}
  .btn-danger:hover{background:#fbe9ec}

  /* Synthèse */
  .synth-grid{display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start}
  table.recap{width:100%; border-collapse:collapse}
  table.recap th, table.recap td{padding:10px 10px; border-bottom:1px solid var(--border); text-align:left; font-size:.92rem}
  table.recap th{font-size:.72rem; text-transform:uppercase; letter-spacing:.5px; color:var(--muted)}
  table.recap td.sc{text-align:right; font-weight:800; font-variant-numeric:tabular-nums}
  table.recap .mini{height:8px; width:100%; background:#dfe4f1; border-radius:99px; overflow:hidden; margin-top:5px}
  table.recap .mini>span{display:block; height:100%; border-radius:99px}
  table.recap tr.total td{font-weight:800; color:var(--navy-dark); border-top:2px solid var(--navy); border-bottom:none}
  #radarWrap{display:flex; justify-content:center; align-items:center}
  #radar{max-width:100%; height:auto}

  /* Rappel projet (synthèse) */
  .projet-recap{background:#f7f9ff; border:1.5px solid #dde3f4; border-radius:12px; padding:12px 16px; margin:0 0 20px}
  .projet-recap .pr-label{font-weight:700; color:var(--navy-dark)}
  .pr-idee{margin-bottom:9px; white-space:pre-wrap}
  .pr-flags{display:flex; flex-wrap:wrap; gap:8px 24px}
  .pr-flag{font-weight:600; color:var(--muted)}
  .pr-flag.on{color:var(--green)}

  /* Détail par thématique (synthèse) */
  .bilan-detail{margin-top:28px}
  .bilan-title{color:var(--navy-dark); font-size:1.2rem; margin:0 0 16px; padding-bottom:7px; border-bottom:2px solid var(--gold)}
  .bilan-theme{border:1.5px solid var(--border); border-radius:14px; padding:16px 18px; margin-bottom:16px; background:#fff;
        break-inside:avoid; page-break-inside:avoid}
  .bt-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:11px}
  .bt-head h4{margin:0; color:var(--navy-dark); font-size:1.06rem}
  .bt-head .theme-num{color:var(--gold-dark); font-weight:800}
  .bt-score{font-weight:800; font-size:.92rem; border:1.5px solid; border-radius:99px; padding:3px 12px; white-space:nowrap}
  .bt-open{background:#f7f9ff; border-left:4px solid var(--gold); border-radius:0 8px 8px 0; padding:10px 14px; margin-bottom:13px}
  .bt-open-q{font-weight:700; color:var(--navy-dark); font-size:.92rem; margin-bottom:4px}
  .bt-open-a{font-size:.92rem; white-space:pre-wrap}
  .bt-items{display:flex; flex-direction:column}
  .bt-item{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:7px 2px; border-bottom:1px solid #eef1f7}
  .bt-item:last-child{border-bottom:none}
  .bt-txt{font-size:.9rem; color:var(--text)}
  .bt-val{display:inline-flex; align-items:center; gap:9px; white-space:nowrap; flex:0 0 auto}
  .lvl{display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:7px;
       color:#fff; font-weight:800; font-size:.85rem; flex:0 0 auto}
  .lvl.na{background:#c3c9d6}
  .lvl-lab{font-size:.77rem; color:var(--muted); min-width:88px; text-align:right}

  .footnote{font-size:.8rem; color:var(--muted); text-align:center; margin-top:26px}

  @media (max-width:640px){
    .id-grid, .synth-grid{grid-template-columns:1fr}
    .opt .l{display:none}
    .opts{gap:6px}
    header.app{flex-direction:column; text-align:center}
  }

  /* ---------- IMPRESSION / PDF : bilan détaillé, sans couper une thématique ---------- */
  @media print{
    @page{ size:A4; margin:12mm; }
    *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    body{background:#fff}
    .wrap{max-width:100%; padding:0; margin:0}
    .no-print{display:none !important}
    .progress, .footnote{display:none}

    /* Seule la carte synthèse est présente à l'impression (depuis le bouton PDF) */
    .card{box-shadow:none; border:none; margin:0; padding:0; border-radius:0}
    .eyebrow{display:none}
    .card h2{font-size:1.25rem; margin-bottom:2px}
    .lead{margin:.1rem 0 .6rem; font-size:.85rem}

    /* En-tête compact avec logo */
    header.app{background:#fff !important; color:#000; border:none; border-bottom:2px solid var(--navy);
               border-radius:0; padding:0 0 8px; gap:14px; margin-bottom:6px}
    header.app .logo{padding:0; box-shadow:none}
    header.app .logo img{height:44px}
    header.app h1{font-size:1.05rem; color:var(--navy-dark)}
    header.app p{font-size:.78rem; color:#444}

    /* Vue d'ensemble : scores + radar, sans coupure */
    .synth-grid{gap:16px; page-break-inside:avoid; break-inside:avoid}
    table.recap th, table.recap td{padding:5px 8px; font-size:.82rem}
    #radar{width:260px; height:260px}
    .projet-recap{background:#f4f6fb !important; break-inside:avoid}

    /* Détail par thématique : jamais coupé entre deux pages */
    .bilan-title{font-size:1.08rem}
    .bilan-theme{break-inside:avoid; page-break-inside:avoid; border:1px solid #ccc; margin-bottom:12px; background:#fff !important}
    .bt-open{background:#f4f6fb !important}
    .bt-txt, .bt-open-a, .lvl-lab{font-size:.82rem}
  }
</style>
</head>

  const t = THEMES.find(x=>x.id===themeId);
  const ans = themeAnswers(themeId);
  return { moy: ans.length? ans.reduce((a,b)=>a+b,0)/ans.length : null,
           rep: ans.length, tot: t.items.length };
}
function scoreColor(moy){
  if(moy===null) return "#c3c9d6";
  if(moy < 2) return "var(--bordeaux)";
  if(moy < 3) return "var(--gold-dark)";
  return "var(--green)";
}

/* =========================================================
   RENDU
   ========================================================= */
const app = document.getElementById("app");

function render(){
  updateProgress();
  if(state.step===0) return renderIntro();
  if(state.step>=1 && state.step<=THEMES.length) return renderTheme(THEMES[state.step-1]);
  return renderSynthese();
}

function updateProgress(){
  const pct = Math.round((state.step/(TOTAL_STEPS)) * 100);
  document.getElementById("progBar").style.width = pct+"%";
  let lab;
  if(state.step===0) lab="Introduction";
  else if(state.step<=THEMES.length) lab="Étape "+state.step+" / "+TOTAL_STEPS+" — Thématique "+THEMES[state.step-1].id;
  else lab="Synthèse";
  document.getElementById("progLab").textContent = lab;
}

/* ---------- Intro / identité ---------- */
function renderIntro(){
  app.innerHTML = `
    <div class="card step">
      <span class="eyebrow">Avant de commencer</span>
      <h2>Bienvenue dans votre auto-évaluation</h2>
      <p class="lead">Ce questionnaire vous permet de vous positionner sur les compétences des UC1 &amp; UC2 du DEJEPS Rugby.
      Pour chaque thématique, vous répondez d'abord à une question ouverte, puis vous vous situez sur une échelle de 1 à 4.
      Comptez environ 15 à 20 minutes. Vos réponses sont enregistrées automatiquement sur cet appareil.</p>
      <div class="id-grid">
        <div class="field"><label>Prénom</label><input id="id_prenom" value="${esc(state.id.prenom)}" placeholder="Votre prénom"></div>
        <div class="field"><label>Nom</label><input id="id_nom" value="${esc(state.id.nom)}" placeholder="Votre nom"></div>
        <div class="field"><label>Club</label><input id="id_club" value="${esc(state.id.club)}" placeholder="Nom du club"></div>
        <div class="field"><label>Date</label><input id="id_date" type="date" value="${esc(state.id.date)}"></div>
        <div class="field" style="grid-column:1/-1"><label>Session / Promotion</label><input id="id_session" value="${esc(state.id.session)}" placeholder="Ex. UC1-2 26-27"></div>
        <div class="field" style="grid-column:1/-1"><label>Idée de projet</label><textarea id="id_idee" class="idee" placeholder="Décrivez en quelques lignes votre idée de projet…">${esc(state.id.idee||"")}</textarea></div>
      </div>
      <div class="checks">
        <label class="check"><input type="checkbox" id="id_exige" ${state.id.exige?"checked":""}><span>Projet exigé par mon club</span></label>
        <label class="check"><input type="checkbox" id="id_modifiable" ${state.id.modifiable?"checked":""}><span>Projet encore modifiable</span></label>
      </div>
      <div class="nav no-print">
        <button class="btn btn-danger" onclick="resetAll()">↺ Tout effacer</button>
        <button class="btn btn-primary" onclick="next()">Commencer →</button>
      </div>
    </div>`;
  ["prenom","nom","club","date","session","idee"].forEach(k=>{
    document.getElementById("id_"+k).addEventListener("input", e=>{ state.id[k]=e.target.value; save(); });
  });
  ["exige","modifiable"].forEach(k=>{
    document.getElementById("id_"+k).addEventListener("change", e=>{ state.id[k]=e.target.checked; save(); });
  });
}

/* ---------- Thématique ---------- */
function renderTheme(t){
  if(t.outils) return renderTools(t);

  const openVal = state.open[t.id] || "";
  const validated = state.open["v_"+t.id] === true;
  const sc = themeScore(t.id);

  app.innerHTML = `
    <div class="card step">
      <span class="eyebrow">Thématique ${t.id} / 8</span>
      <h2><span class="theme-num">${t.id}.</span> ${t.titre}</h2>

      <div class="open-block ${validated?'validated':''}" id="openBlock">
        <div class="q"><span class="ico">✎</span><span>${esc(t.ouverte)}</span></div>
        <textarea id="openText" placeholder="Écrivez votre réponse ici…">${esc(openVal)}</textarea>
        <div class="open-actions">
          <button class="btn btn-valider" id="btnValider" onclick="validateOpen(${t.id})">Valider ma réponse</button>
          <span class="check-tag">✓ Réponse validée — vous pouvez vous auto-évaluer ci-dessous</span>
          <span class="hint" id="openHint"></span>
        </div>
      </div>

      <div class="closed ${validated?'show':''}" id="closedSection">
        <div class="legend">
          <span><b>1</b> ${SCALE_THEME[0]}</span>
          <span><b>2</b> ${SCALE_THEME[1]}</span>
          <span><b>3</b> ${SCALE_THEME[2]}</span>
          <span><b>4</b> ${SCALE_THEME[3]}</span>
        </div>
        ${t.items.map((txt,i)=>itemHTML(t.id,i,txt)).join("")}
        ${scoreBoxHTML(t.id)}
      </div>

      <div class="nav no-print">
        <button class="btn btn-ghost" onclick="prev()">← Précédent</button>
        <button class="btn btn-primary" onclick="next()">Suivant →</button>
      </div>
    </div>`;

  const ta = document.getElementById("openText");
  ta.addEventListener("input", e=>{ state.open[t.id]=e.target.value; save(); });
}

function itemHTML(themeId,i,txt){
  const key = themeId+"_"+i;
  const cur = state.closed[key];
  return `<div class="item ${cur?'answered':''}" id="item_${key}">
    <div class="txt">${esc(txt)}</div>
    <div class="opts">
      ${[1,2,3,4].map(n=>`
        <div class="opt">
          <input type="radio" name="${key}" id="${key}_${n}" value="${n}" ${String(cur)===String(n)?'checked':''}
                 onchange="answer('${key}',${n})" title="${esc(SCALE_THEME[n-1])}">
          <label for="${key}_${n}"><span class="n">${n}</span><span class="l">${SCALE_SHORT[n-1]}</span></label>
        </div>`).join("")}
    </div>
  </div>`;
}

function scoreBoxHTML(themeId){
  const sc = themeScore(themeId);
  const moyTxt = sc.moy===null ? "—" : sc.moy.toFixed(1).replace(".",",");
  const pct = sc.moy===null ? 0 : (sc.moy/4*100);
  return `<div class="score-box" id="scoreBox_${themeId}">
    <div class="val">${moyTxt}<small> / 4</small></div>
    <div class="meta">
      <div style="font-weight:600;color:var(--navy-dark)">Score de la thématique</div>
      <div class="score-bar"><span style="width:${pct}%;background:${scoreColor(sc.moy)}"></span></div>
      <div class="count">${sc.rep} / ${sc.tot} item${sc.tot>1?'s':''} renseigné${sc.rep>1?'s':''}</div>
    </div>
  </div>`;
}

/* ---------- Thématique 8 : outils (sans score) ---------- */
function renderTools(t){
  app.innerHTML = `
    <div class="card step">
      <span class="eyebrow">Thématique ${t.id} / 8</span>
      <h2><span class="theme-num">${t.id}.</span> ${t.titre}</h2>
      <p class="tools-legend"><b>1</b> ${SCALE_TOOL[0]} · <b>2</b> ${SCALE_TOOL[1]} · <b>3</b> ${SCALE_TOOL[2]} · <b>4</b> ${SCALE_TOOL[3]}</p>
      <table class="tools">
        <thead><tr><th>Outil / Notion</th><th>1</th><th>2</th><th>3</th><th>4</th></tr></thead>
        <tbody>
          ${t.items.map((txt,i)=>{
            const key="tool_"+i; const cur=state.tools[key];
            return `<tr><td>${esc(txt)}</td>${[1,2,3,4].map(n=>
              `<td><input type="radio" name="${key}" value="${n}" ${String(cur)===String(n)?'checked':''} onchange="answerTool('${key}',${n})" title="${esc(SCALE_TOOL[n-1])}"></td>`).join("")}</tr>`;
          }).join("")}
        </tbody>
      </table>
      <div class="nav no-print">
        <button class="btn btn-ghost" onclick="prev()">← Précédent</button>
        <button class="btn btn-primary" onclick="next()">Voir ma synthèse →</button>
      </div>
    </div>`;
}

/* ---------- Synthèse ---------- */
function bilanItemRow(txt, v){
  let val;
  if(v){ val = `<span class="lvl" style="background:${scoreColor(Number(v))}">${v}</span><span class="lvl-lab">${SCALE_SHORT[v-1]}</span>`; }
  else { val = `<span class="lvl na">—</span><span class="lvl-lab">non renseigné</span>`; }
  return `<div class="bt-item"><span class="bt-txt">${esc(txt)}</span><span class="bt-val">${val}</span></div>`;
}
function bilanThemeHTML(t){
  if(t.outils){
    const rows = t.items.map((txt,i)=> bilanItemRow(txt, state.tools["tool_"+i])).join("");
    return `<section class="bilan-theme">
      <div class="bt-head"><h4><span class="theme-num">${t.id}.</span> ${esc(t.titre)}</h4></div>
      <div class="bt-items">${rows}</div>
    </section>`;
  }
  const sc=themeScore(t.id);
  const moyTxt = sc.moy===null?"—":sc.moy.toFixed(1).replace(".",",");
  const col = scoreColor(sc.moy);
  const a=(state.open[t.id]||"").trim();
  const rows = t.items.map((txt,i)=> bilanItemRow(txt, state.closed[t.id+"_"+i])).join("");
  return `<section class="bilan-theme">
    <div class="bt-head">
      <h4><span class="theme-num">${t.id}.</span> ${esc(t.titre)}</h4>
      <span class="bt-score" style="border-color:${col};color:${col}">${moyTxt} / 4</span>
    </div>
    <div class="bt-open">
      <div class="bt-open-q">${esc(t.ouverte)}</div>
      <div class="bt-open-a">${a? esc(a):'<em style="color:var(--muted)">— non renseigné —</em>'}</div>
    </div>
    <div class="bt-items">${rows}</div>
  </section>`;
}
function renderSynthese(){
  const rows = SCORED.map(t=>{
    const sc=themeScore(t.id);
    const moyTxt = sc.moy===null?"—":sc.moy.toFixed(1).replace(".",",");
    const pct = sc.moy===null?0:(sc.moy/4*100);
    return `<tr>
      <td>${t.id}. ${esc(t.titre)}
        <div class="mini"><span style="width:${pct}%;background:${scoreColor(sc.moy)}"></span></div>
      </td>
      <td class="sc">${moyTxt}<span style="font-weight:500;color:var(--muted)"> /4</span></td>
    </tr>`;
  }).join("");

  const all = SCORED.map(t=>themeScore(t.id).moy).filter(v=>v!==null);
  const glob = all.length? (all.reduce((a,b)=>a+b,0)/all.length) : null;
  const globTxt = glob===null?"—":glob.toFixed(1).replace(".",",");

  app.innerHTML = `
    <div class="card step">
      <span class="eyebrow">Synthèse</span>
      <h2>Votre profil de positionnement</h2>
      <p class="lead">${esc(state.id.prenom)} ${esc(state.id.nom)}${state.id.club?" · "+esc(state.id.club):""}${state.id.session?" · "+esc(state.id.session):""}${state.id.date?" · "+esc(formatDate(state.id.date)):""}</p>
      <div class="projet-recap">
        <div class="pr-idee"><span class="pr-label">Idée de projet :</span> ${state.id.idee? esc(state.id.idee):'<em style="color:var(--muted)">— non renseignée —</em>'}</div>
        <div class="pr-flags">
          <span class="pr-flag ${state.id.exige?'on':''}">${state.id.exige?'☑':'☐'} Projet exigé par mon club</span>
          <span class="pr-flag ${state.id.modifiable?'on':''}">${state.id.modifiable?'☑':'☐'} Projet encore modifiable</span>
        </div>
      </div>
      <div class="synth-grid">
        <div>
          <table class="recap">
            <thead><tr><th>Thématique</th><th style="text-align:right">Score</th></tr></thead>
            <tbody>
              ${rows}
              <tr class="total"><td>Moyenne générale (thém. 1 à 7)</td><td class="sc">${globTxt}<span style="font-weight:500"> /4</span></td></tr>
            </tbody>
          </table>
        </div>
        <div id="radarWrap"><canvas id="radar" width="420" height="420"></canvas></div>
      </div>

      <div class="bilan-detail">
        <h3 class="bilan-title">Détail des réponses par thématique</h3>
        ${THEMES.map(t=>bilanThemeHTML(t)).join("")}
      </div>

      <div class="nav no-print">
        <button class="btn btn-ghost" onclick="prev()">← Précédent</button>
        <div style="display:flex; gap:10px">
          <button class="btn btn-danger" onclick="resetAll()">↺ Recommencer</button>
          <button class="btn btn-gold" onclick="window.print()">🖨 Imprimer / Enregistrer en PDF</button>
        </div>
      </div>
    </div>`;

  drawRadar();
}

/* ---------- Radar (canvas, sans librairie) ---------- */
function drawRadar(){
  const cv=document.getElementById("radar"); if(!cv) return;
  const ctx=cv.getContext("2d");
  const W=cv.width, H=cv.height, cx=W/2, cy=H/2, R=Math.min(W,H)/2-58;
  const N=SCORED.length;
  ctx.clearRect(0,0,W,H);

  // grilles concentriques (1..4)
  for(let lvl=1;lvl<=4;lvl++){
    const r=R*lvl/4;
    ctx.beginPath();
    for(let i=0;i<N;i++){
      const a=-Math.PI/2 + i*2*Math.PI/N;
      const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle="#dfe4f1"; ctx.lineWidth=1; ctx.stroke();
  }
  // axes + labels
  ctx.fillStyle="#6b7488"; ctx.font="600 12px -apple-system,Segoe UI,Roboto,sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  for(let i=0;i<N;i++){
    const a=-Math.PI/2 + i*2*Math.PI/N;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.lineTo(cx+R*Math.cos(a), cy+R*Math.sin(a));
    ctx.strokeStyle="#e8ebf3"; ctx.stroke();
    const lx=cx+(R+26)*Math.cos(a), ly=cy+(R+26)*Math.sin(a);
    ctx.fillStyle="#22356e";
    ctx.fillText(String(SCORED[i].id), lx, ly);
  }
  // polygone des scores
  ctx.beginPath();
  let any=false;
  for(let i=0;i<N;i++){
    const sc=themeScore(SCORED[i].id).moy;
    const v = sc===null?0:sc;
    if(sc!==null) any=true;
    const r=R*v/4;
    const a=-Math.PI/2 + i*2*Math.PI/N;
    const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.closePath();
  if(any){
    ctx.fillStyle="rgba(34,53,110,.20)";
    ctx.strokeStyle="#22356e"; ctx.lineWidth=2.5;
    ctx.fill(); ctx.stroke();
    // points
    for(let i=0;i<N;i++){
      const sc=themeScore(SCORED[i].id).moy; if(sc===null) continue;
      const r=R*sc/4; const a=-Math.PI/2 + i*2*Math.PI/N;
      ctx.beginPath(); ctx.arc(cx+r*Math.cos(a), cy+r*Math.sin(a),4,0,2*Math.PI);
      ctx.fillStyle="#f3c01b"; ctx.fill(); ctx.strokeStyle="#22356e"; ctx.lineWidth=1.5; ctx.stroke();
    }
  } else {
    ctx.fillStyle="#9aa2b4"; ctx.font="13px sans-serif";
    ctx.fillText("Aucune réponse pour l'instant", cx, cy);
  }
}

/* =========================================================
   INTERACTIONS
   ========================================================= */
function validateOpen(themeId){
  const ta=document.getElementById("openText");
  const val=(ta.value||"").trim();
  if(val.length<2){
    document.getElementById("openHint").textContent="Merci d'écrire une réponse avant de valider.";
    ta.focus();
    return;
  }
  state.open[themeId]=ta.value;
  state.open["v_"+themeId]=true;
  save();
  document.getElementById("openBlock").classList.add("validated");
  document.getElementById("closedSection").classList.add("show");
  document.getElementById("openHint").textContent="";
}

function answer(key,n){
  state.closed[key]=n; save();
  document.getElementById("item_"+key).classList.add("answered");
  // mise à jour du score de la thématique courante
  const themeId=Number(key.split("_")[0]);
  const box=document.getElementById("scoreBox_"+themeId);
  if(box) box.outerHTML=scoreBoxHTML(themeId);
}

function answerTool(key,n){ state.tools[key]=n; save(); }

function next(){
  if(state.step===0) syncIdFromIntro();
  if(state.step < TOTAL_STEPS){ state.step++; save(); scrollTop(); render(); }
}
function prev(){ if(state.step>0){ state.step--; save(); scrollTop(); render(); } }
function syncIdFromIntro(){
  ["prenom","nom","club","date","session","idee"].forEach(k=>{
    const el=document.getElementById("id_"+k); if(el) state.id[k]=el.value;
  });
  ["exige","modifiable"].forEach(k=>{
    const el=document.getElementById("id_"+k); if(el) state.id[k]=el.checked;
  });
  save();
}
function scrollTop(){ window.scrollTo({top:0,behavior:"smooth"}); }

function resetAll(){
  if(!confirm("Effacer toutes vos réponses et recommencer à zéro ?")) return;
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  state={ step:0, id:{nom:"",prenom:"",club:"",date:"",session:"UC1-2 26-27",idee:"",exige:false,modifiable:false}, open:{}, closed:{}, tools:{} };
  scrollTop(); render();
}

/* utils */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function formatDate(d){ if(!d) return ""; const p=d.split("-"); return p.length===3? p[2]+"/"+p[1]+"/"+p[0] : d; }

render();
</script>
